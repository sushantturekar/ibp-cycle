    h+='<div class="panel"><div class="ph"><span class="step">⏱</span><h3>Time on the clock</h3></div><div class="pb"><table><tbody>'+
       '<tr><td>Total</td><td class="brand">'+mmss(tt)+'</td><td>Average per cycle</td><td>'+mmss(avg)+'</td></tr>'+
       '</tbody></table><div class="foot">Time is not scored; it is the tiebreaker when two people land the same composite.</div></div></div>';
  }

  if(c.total>=90){
    h+='<div class="panel" style="border-color:var(--amber)"><div class="ph"><span class="step">13</span><h3>Month thirteen</h3><span class="note">unlocked at 90</span></div><div class="pb">'+
       '<div style="margin-bottom:10px">You scored high enough to see what happens next. December\'s order book was not demand — it was the trade pulling stock into the fiscal year. In January it reverses.</div>'+
       '<table><thead><tr><th>January</th><th>Consumption</th><th>Sell-in</th><th>Ratio</th></tr></thead><tbody>'+
       '<tr><td>Portfolio</td><td>~1,430</td><td class="bad">~1,050</td><td class="bad">0.73</td></tr>'+
       '</tbody></table>'+
       '<div class="foot">Every unit you built in December to chase that order book is now sitting in your network for a quarter. The best plan in the game is not the one that maximises December.</div></div></div>';
  }

  var code="IBP·"+(TEAM?TEAM.replace(/[^A-Za-z0-9 ]/g,"")+"·":"")+MODE.tier.toUpperCase()+"·"+c.total.toFixed(0)+
    "·F"+(c.cfr*100).toFixed(1)+"·C"+(c.capture*100).toFixed(1)+"·D"+c.doh.toFixed(0)+"·M"+(c.mape*100).toFixed(1)+
    "·T"+S.trust.toFixed(0)+"·A"+Math.round(S.cum.airCost)+(MODE.clock?"·"+mmss(S.totalMs):"")+"·s"+SEED;
  h+='<div class="panel"><div class="ph"><span class="step">#</span><h3>Score code</h3><span class="note">paste this to compare runs</span></div><div class="pb">'+
     '<div class="row"><input id="codebox" readonly value="'+code+'" style="flex:1;min-width:240px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-family:\'IBM Plex Mono\',monospace;font-size:12px;padding:8px;border-radius:2px">'+
     '<button id="copycode">Copy</button></div>'+
     '<div class="foot">Composite · fill · capture · days on hand · MAPE · final standing · air spend'+(MODE.clock?" · time":"")+' · seed.</div></div></div>';
  h+='<div class="row"><button class="primary" id="again">Run the year again</button><span class="dim">Same demand seed — a better score is a better plan, not better luck.</span></div>';
  return h;
}

function attribution(c){
  var real=S.history.filter(function(x){return !x.prior;}), out=[];
  var lost={}, tot=0;
  MARKETS.forEach(function(m){ lost[m.id]=0; });
  real.forEach(function(h){ MARKETS.forEach(function(m){ lost[m.id]+=h.lostBy[m.id]; tot+=h.lostBy[m.id]; }); });

  var pFill=30-c.parts.sFill;
  if(pFill>0.4){
    var worst=real.slice().sort(function(a,b){return a.cfr-b.cfr;}).slice(0,2).map(function(h){return h.month+" "+pct(h.cfr);});
    var byReg=MARKETS.slice().sort(function(a,b){return lost[b.id]-lost[a.id];}).map(function(m){
      return m.short+" "+fmt(lost[m.id])+"K ("+(tot?Math.round(lost[m.id]/tot*100):0)+"%)"; });
    out.push({pts:pFill,head:"Service — units you could not ship",
      detail:fmt(tot)+"K units of sell-in went unfilled. Concentration: "+byReg.join(" · ")+". Worst cycles: "+worst.join(", ")+".",
      fix: lost.apac/(tot||1)>0.3 ? "APAC drove it. That lane is three months long by sea — the correction has to be committed before you can see the problem, or flown at ten times the rate once you can."
         : "Build earlier in the cycle, or buy the month with overtime or air where the contribution justifies it."});
  }
  var pCap=25-c.parts.sCap;
  if(pCap>0.4){
    var comp=[["margin forfeited to stockouts",S.cum.lostGM],["overtime premium",S.cum.otCost],
              ["air freight",S.cum.airCost],["obsolescence write-off",S.cum.waste],["carrying cost",S.cum.carry]]
             .sort(function(a,b){return b[1]-a[1];});
    out.push({pts:pCap,head:"Margin capture — value that left the P&L",
      detail:comp.map(function(x){return x[0]+" "+money(x[1]);}).join(" · ")+".",
      fix: S.cum.airCost>S.cum.lostGM ? "You spent more flying stock than the stockouts would have cost. Compare contribution per unit against the freight premium before you book."
         : (S.cum.otCost>S.cum.lostGM ? "You bought more capacity than the service was worth. Overtime is a timing decision, not a standing policy."
         : "The loss is stockouts, not cost. More cover, more capacity or a well-timed charter would have paid for itself.")});
  }
  var pInv=20-c.parts.sInv;
  if(pInv>0.4){
    var hi=c.doh>75;
    out.push({pts:pInv,head:"Inventory position — "+(hi?"too much cover":"too little cover"),
      detail:"Averaged "+c.doh.toFixed(0)+" days against a 75-day target, "+(hi?"+":"−")+Math.abs(c.doh-75).toFixed(0)+" days off.",
      fix: hi?"Cut safety stock or stop building into a decelerating category.":"Raise safety stock. Below target you have no buffer for a lane you cannot correct."});
  }
  var pAcc=15-c.parts.sAcc;
  if(pAcc>0.4){
    out.push({pts:pAcc,head:"Forecast error — sell-in you did not see coming",
      detail:"MAPE "+pct(c.mape)+" against a 20% par.",
      fix:"Trade inventory moves ahead of consumption and always reverses. Read the WOS column, not the order."});
  }
  var pBias=10-c.parts.sBias;
  if(pBias>0.4){
    out.push({pts:pBias,head:"Bias — "+(c.bias>0?"you over-forecast all year":"you under-forecast all year"),
      detail:"Cumulative bias "+signed(c.bias*100)+" against a ±8% band.",
      fix:c.bias>0?"Persistent optimism carries a carrying-cost bill every month.":"Persistent caution is invisible until the lane you starved cannot recover."});
  }
  return out.sort(function(a,b){return b.pts-a.pts;});
}

function badges(c){
  var f=S.flags, real=S.history.filter(function(x){return !x.prior;}), out=[];
  if(f.otMonths===0) out.push(["Purist","Twelve cycles, not one hour of overtime."]);
  if(f.flewNever)    out.push(["Never left the ground","Twelve cycles by sea and road. Not a single unit flown."]);
  if(!f.usedAuto)    out.push(["By hand","Never once auto-filled from the baseline."]);
  if(f.chtrMonths>0 && f.chtrMonths<=2 && c.capture>=0.91)
                     out.push(["One good charter","Flew exactly when it paid and never again."]);
  if(real.some(function(h){return h.cfr>=0.999 && h.otUnits===0 && h.airUnits===0 && h.doh>=55 && h.doh<=95;}))
                     out.push(["Textbook","A cycle with everything shipped, nothing flown, no overtime, cover in band."]);
  if(f.buzzer===0 && MODE.clock) out.push(["Never late","Every cycle committed before the clock ran out."]);
  if(f.keptFaith)    out.push(["Read the fine print","Checked the source line before believing the number."]);
  if(f.sawItComing)  out.push(["Three months early","Covered the APAC listing before it existed."]);
  if(c.cfr>=0.98 && c.capture>=0.92) out.push(["Both sides","Service and margin, at the same time."]);
  if(f.otMonths>0 && f.otMonths<=6 && c.capture>=0.93) out.push(["Surgical","Overtime only in the cycles that paid for it."]);
  if(f.otMonths>=3 && f.otStreakMax<=2) out.push(["Let it cool","Used overtime repeatedly and never once let the line run hot two months in a row."]);
  if(S.trustHist.some(function(t){return t<TRUST_WARN;}) && S.trust>=70)
                     out.push(["Back from the brink","Went under formal warning and finished the year trusted."]);
  return out;
}

/* ---------- where the service actually went ----------
   Fill by region alone never answers "why did I miss in December" — the loss is
   a brand in a lane in a month, and a thousand cases of DigestEase in APAC is
   nothing like a thousand cases of ReliefMax.                                 */
function serviceMatrix(){
  var c=S.cum, tot=0;
  PRODUCTS.forEach(function(p){ MARKETS.forEach(function(m){ tot+=c.lostPM[p.id][m.id]; }); });
  var h='<div class="panel"><div class="ph"><span class="step">⊘</span><h3>Where the service went</h3>'+
        '<span class="note">unfilled sell-in by brand and lane</span></div><div class="pb">';
  if(tot<=0){
    h+='<div class="good" style="padding:12px 0">Nothing went unfilled all year. There is no breakdown to show.</div></div></div>';
    return h;
  }
  h+='<table><thead><tr><th>Brand</th>'+MARKETS.map(function(m){return '<th>'+m.short+'</th>';}).join('')+
     '<th>Units</th><th>Margin forfeited</th></tr></thead><tbody>';
  PRODUCTS.forEach(function(p){
    var rt=0, rg=0;
    MARKETS.forEach(function(m){ rt+=c.lostPM[p.id][m.id]; rg+=c.lostGMPM[p.id][m.id]; });
    h+='<tr><td><span class="brand">'+p.name+'</span></td>'+
      MARKETS.map(function(m){
        var v=c.lostPM[p.id][m.id];
        return '<td class="'+(v>0?"bad":"dim")+'">'+(v>0?fmt(v):"—")+'</td>';
      }).join('')+
      '<td>'+fmt(rt)+'</td><td class="'+(rg>0?"bad":"dim")+'">'+money(rg)+'</td></tr>';
  });
  h+='<tr class="tot"><td>All brands</td>'+MARKETS.map(function(m){
      var v=0; PRODUCTS.forEach(function(p){ v+=c.lostPM[p.id][m.id]; });
      return '<td class="'+(v>0?"bad":"dim")+'">'+(v>0?fmt(v):"—")+'</td>';
    }).join('')+'<td>'+fmt(tot)+'</td><td class="bad">'+money(c.lostGM)+'</td></tr>';
  h+='</tbody></table>';

  var worst=[];
  S.history.filter(function(x){return !x.prior;}).forEach(function(x){
    if(!x.lostPM) return;
    PRODUCTS.forEach(function(p){ MARKETS.forEach(function(m){
      var v=x.lostPM[p.id][m.id];
      if(v>0) worst.push({mo:x.month,p:p.name,rg:m.short,v:v,g:x.lostGMPM[p.id][m.id]});
    });});
  });
  worst.sort(function(a,b){return b.g-a.g;});
  if(worst.length){
    h+='<table style="margin-top:12px"><thead><tr><th>Single worst misses</th><th>Cycle</th><th>Units</th><th>Margin</th></tr></thead><tbody>';
    worst.slice(0,6).forEach(function(w){
      h+='<tr><td><span class="brand">'+w.p+'</span> <span class="sub">'+w.rg+'</span></td>'+
         '<td class="dim">'+w.mo+'</td><td class="bad">'+fmt(w.v)+'</td><td class="bad">'+money(w.g)+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  h+='<div class="foot">Ranked by margin, not units. Contribution per unit runs from about $0.42 on ReliefMax into APAC to $2.86 on DigestEase — the same shortfall is not the same loss.</div></div></div>';
  return h;
}

/* ---------- did the freight actually pay? ----------
   Counterfactual, cycle by cycle: strip the flown units out of inventory at fill
   time and see what would not have shipped. Everything else is just spend.     */
function freightROI(){
  var c=S.cum;
  var h='<div class="panel" style="border-color:'+(c.airUnits>0?"var(--air)":"var(--line)")+'">'+
        '<div class="ph"><span class="step">✈</span><h3>Did the freight pay?</h3>'+
        '<span class="note">air premium against margin rescued</span></div><div class="pb">';
  if(c.airUnits<=0){
    h+='<div class="dim" style="padding:12px 0">Nothing flew this year. Every unit moved on its normal lane at the baseline rate — '+money(c.seaCost)+' of ocean and road freight in total.</div>'+
       '<div class="foot">No premium spent means none wasted. It also means any month you went short, you went short by choice.</div></div></div>';
    return h;
  }
  var conv = c.airUnits>0 ? c.airSavedUnits/c.airUnits : 0;
  var roi  = c.airPrem>0 ? c.airSavedGM/c.airPrem : 0;
  var net  = c.airSavedGM - c.airPrem;
  var verdict;
  if(roi>=2)      verdict="Every dollar of premium came back more than twice over. This is what the freight desk is for.";
  else if(roi>=1) verdict="It paid, but not by much. The margin rescued covered the premium and left "+money(net)+".";
  else if(roi>0)  verdict="It did not pay. You spent "+money(c.airPrem)+" in premium to rescue "+money(c.airSavedGM)+" of margin — a net loss of "+money(Math.abs(net))+".";
  else            verdict="None of it converted. Every unit you flew would have shipped anyway, or landed somewhere that was not short. That is "+money(c.airPrem)+" of premium for nothing.";
  h+='<table><tbody>'+
    '<tr><td>Units flown</td><td class="warn">'+fmt(c.airUnits)+'K</td><td>of which chartered</td><td class="'+(c.chtrUnits>0?"bad":"dim")+'">'+fmt(c.chtrUnits)+'K</td></tr>'+
    '<tr><td>Total air freight</td><td class="warn">'+money(c.airCost)+'</td><td>of which charter</td><td class="'+(c.chtrCost>0?"bad":"dim")+'">'+money(c.chtrCost)+'</td></tr>'+
    '<tr><td><strong>Premium over ocean</strong></td><td class="bad">'+money(c.airPrem)+'</td><td class="sub" colspan="2" style="text-align:left">the part that was a decision, not a cost of doing business</td></tr>'+
    '<tr><td>Units that shipped <em>only</em> because they flew</td><td class="'+(c.airSavedUnits>0?"good":"bad")+'">'+fmt(c.airSavedUnits)+'K</td>'+
      '<td>Conversion</td><td class="'+(conv>=0.5?"good":(conv>=0.2?"warn":"bad"))+'">'+pct(conv)+'</td></tr>'+
    '<tr><td>Margin rescued</td><td class="good">'+money(c.airSavedGM)+'</td>'+
      '<td>Return on premium</td><td class="'+(roi>=1?"good":"bad")+'">'+roi.toFixed(2)+'×</td></tr>'+
    '<tr><td><strong>Net</strong></td><td class="'+(net>=0?"good":"bad")+'">'+(net>=0?"+":"−")+money(Math.abs(net)).replace("$","$")+'</td>'+
      '<td class="sub" colspan="2" style="text-align:left">margin rescued less the premium you paid for it</td></tr>'+
    '</tbody></table>';
  h+='<div class="sig '+(roi>=1?"cold":"hot")+'" style="display:block;margin-top:10px"><span class="tag" style="width:auto;display:block;margin-bottom:4px">Verdict</span><div>'+esc(verdict)+'</div></div>';
  var flew=S.history.filter(function(x){return !x.prior && x.airUnits>0;});
  if(flew.length){
    h+='<table style="margin-top:12px"><thead><tr><th>Cycle</th><th>Flown</th><th>Chartered</th><th>Premium</th><th>Converted</th><th>Margin rescued</th></tr></thead><tbody>';
    flew.forEach(function(x){
      var cv=x.airUnits>0?x.airSavedUnits/x.airUnits:0;
      h+='<tr><td class="brand">'+x.month+'</td><td class="warn">'+fmt(x.airUnits)+'K</td>'+
        '<td class="'+(x.chtrUnits>0?"bad":"dim")+'">'+(x.chtrUnits>0?fmt(x.chtrUnits)+"K":"—")+'</td>'+
        '<td class="bad">'+money(x.airPrem)+'</td>'+
        '<td class="'+(cv>=0.5?"good":(cv>=0.2?"warn":"bad"))+'">'+pct(cv)+'</td>'+
        '<td class="'+(x.airSavedGM>0?"good":"dim")+'">'+money(x.airSavedGM)+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  h+='<div class="foot">Conversion is measured against the counterfactual: at fill time the flown units are removed from inventory and the cycle is re-checked. Anything that would have shipped regardless does not count. Units flown into a lane that was never short convert at zero.</div></div></div>';
  return h;
}

function srow(label,val,target,delta,ok,pts,max){
  return '<tr><td>'+label+'</td><td class="'+(ok?"good":"bad")+'">'+val+'</td><td class="dim">'+target+
         '</td><td class="'+(ok?"good":"bad")+'">'+delta+'</td><td>'+pts.toFixed(1)+' / '+max+'</td></tr>';
}

/* ---------- wiring ---------- */
function wire(){
  document.querySelectorAll('[data-fc]').forEach(function(el){
    el.addEventListener('input',function(){
      var k=el.getAttribute('data-fc').split('|');
      S.forecast[k[0]][k[1]]=Math.max(0,parseInt(el.value||"0",10));
      refresh();
    });
  });
  document.querySelectorAll('[data-prod]').forEach(function(el){
    el.addEventListener('input',function(){
      S.prod[el.getAttribute('data-prod')]=Math.max(0,parseInt(el.value||"0",10));
      refresh();
    });
  });
  document.querySelectorAll('[data-air]').forEach(function(el){
    el.addEventListener('input',function(){
      var k=el.getAttribute('data-air');
      S.air[k].u=Math.max(0,parseInt(el.value||"0",10));
      refresh();
    });
  });
  document.querySelectorAll('[data-airtier]').forEach(function(el){
    el.addEventListener('change',function(){
      S.air[el.getAttribute('data-airtier')].tier=el.value;
      refresh();
    });
  });
  document.querySelectorAll('[data-pol]').forEach(function(el){
    el.addEventListener('change',function(){ S.policy[el.getAttribute('data-pol')]=el.value; render(); });
  });
  document.querySelectorAll('[data-split]').forEach(function(el){
    el.addEventListener('input',function(){
      var k=el.getAttribute('data-split').split('|');
      S.split[k[0]][k[1]]=Math.max(0,parseFloat(el.value||"0"));
      refresh();
    });
  });
  document.querySelectorAll('[data-hz]').forEach(function(el){
    el.addEventListener('change',function(){
      var b=el.getAttribute('data-hz'), v=parseFloat(el.value);
      MARKETS.forEach(function(m){ S.hz[b][m.id]=v; });
      refresh();
    });
  });
  document.querySelectorAll('[data-wh]').forEach(function(el){
    el.addEventListener('click',function(){
      var id=el.getAttribute('data-wh');
      S.drill = (S.drill===id) ? null : id;
      render();
    });
  });
  var ss=document.getElementById('ss');
  if(ss) ss.addEventListener('input',function(){
    S.ss=parseFloat(ss.value);
    document.getElementById('sslbl').textContent=S.ss.toFixed(1)+' weeks of cover';
    refresh();
  });
  var cb=document.getElementById('commit'); if(cb) cb.addEventListener('click',commit);
  var ab=document.getElementById('auto');   if(ab) ab.addEventListener('click',autofill);
  var rb=document.getElementById('restart');if(rb) rb.addEventListener('click',restart);

  if(TICK) clearInterval(TICK);
  TICK=setInterval(tick,250); tick();

  if(!window.__enterBound){
    window.__enterBound=true;
    document.addEventListener('keydown',function(ev){
      if(ev.key!=="Enter") return;
      var b=document.getElementById('commit');
      if(b && !b.disabled){ ev.preventDefault(); b.click(); }
      else { var g=document.getElementById('begin'); if(g) g.click(); }
    });
  }
  function launch(seed){
    var tn=document.getElementById('teamname'); if(tn) TEAM=tn.value.trim();
    SEED=seed; S=initialState(); S.introDismissed=true; S.started=true; S.t0=Date.now();
    render(); window.scrollTo(0,0);
  }
  document.querySelectorAll('[data-mode]').forEach(function(el){
    el.addEventListener('click',function(){ MODE=MODES[el.getAttribute('data-mode')]; S=initialState(); S.introDismissed=false; render(); });
  });
  var bg=document.getElementById('begin');
  if(bg) bg.addEventListener('click',function(){ launch(SHARED_SEED); });
  var bgr=document.getElementById('beginr');
  if(bgr) bgr.addEventListener('click',function(){ launch(Math.floor(Math.random()*900000000)+100000000); });
}

function wireEnd(){
  var ag=document.getElementById('again'); if(ag) ag.addEventListener('click',restart);
  var cc=document.getElementById('copycode');
  if(cc) cc.addEventListener('click',function(){
    var box=document.getElementById('codebox');
    box.select(); box.setSelectionRange(0,999);
    try{ if(navigator.clipboard) navigator.clipboard.writeText(box.value); else document.execCommand('copy'); }catch(e){}
    cc.textContent="Copied"; setTimeout(function(){cc.textContent="Copy";},1500);
  });
}

/* the narrow-screen notice lives outside #app, so render() never clears it */
(function(){
  var x=document.getElementById('mobclose');
  if(x) x.addEventListener('click',function(){
    var n=document.getElementById('mobilenote');
    if(n) n.style.display='none';
  });
})();

if(LOCK) MODE=MODES[LOCK];
S=initialState();
render();
</script>
